<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Báo Cáo Biến Động Nhân Sự</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f1f5f9;--c:#fff;--t:#0f172a;--m:#64748b;--p:#1d4ed8;--b:#e2e8f0;--r:#dc2626;--g:#16a34a;--o:#ea580c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(120deg,#0f172a,#1e3a8a);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0}nav{display:flex;gap:6px}
nav button{background:transparent;border:0;color:#cbd5e1;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:#1e3a8a;font-weight:600}
main{padding:18px 24px;max-width:1700px;margin:auto}.card{background:var(--c);border-radius:12px;box-shadow:0 1px 3px #0001;padding:16px;margin-bottom:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
button.b,label.b{background:var(--p);color:#fff;border:0;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-block}
.b.s{background:#e2e8f0;color:var(--t)}.b.r{background:var(--r)}.b.g{background:var(--g)}
input,select{padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:5px 12px;border-radius:20px;background:#e2e8f0;cursor:pointer;font-size:13px}.pill.on{background:var(--p);color:#fff}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--b);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:#f8fafc;position:sticky;top:0;text-align:left;padding:8px;border-bottom:2px solid var(--b);white-space:nowrap;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--b)}tr:hover td{background:#f8fafc}tr.due td{background:#fee2e2;color:#991b1b;font-weight:600}
td.n,th.n{text-align:right}tfoot td{font-weight:700;background:#f1f5f9}
.ic{border:0;background:#e2e8f0;border-radius:6px;padding:3px 7px;cursor:pointer;margin-right:2px}.ic:hover{background:#cbd5e1}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--c);border-radius:12px;padding:14px 16px;border-left:5px solid var(--p);box-shadow:0 1px 3px #0001}.k small{color:var(--m)}.k b{display:block;font-size:26px}
.k.g{border-color:var(--g)}.k.r{border-color:var(--r)}.k.o{border-color:var(--o)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.ch{position:relative;height:340px}
.mask{position:fixed;inset:0;background:#0f172a99;display:flex;align-items:center;justify-content:center;z-index:50}
.mod{background:#fff;border-radius:14px;padding:20px;width:min(620px,94vw);max-height:90vh;overflow:auto}.mod h3{margin:0 0 12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--m);display:block}.f input{width:100%}.f .w{grid-column:1/-1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hide{display:none}
.rt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.rt button{padding:9px 16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;cursor:pointer}.rt button.on{background:var(--p);color:#fff;border-color:var(--p)}
.pg{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--m)}
</style></head><body>

function form(title,fields,v,ok,extra){const h=fields.map(([k,l,t])=>`<div class="${k=='gc'?'w':''}"><label>${l}</label><input name="${k}" type="${t||'text'}" ${DL[k]?`list="dl_${DL[k]}"`:''} value="${esc(v[k]??'')}"></div>`).join('');
$('#mm').innerHTML=`<div class="mask"><div class="mod"><h3>${title}</h3>${extra||''}<div class="f">${h}</div><div class="foot"><button class="b s" id="mc">Hủy</button><button class="b" id="mo">Lưu</button></div></div></div>`;
$('#mc').onclick=()=>$('#mm').innerHTML='';$('#mo').onclick=()=>{const o={};$('#mm').querySelectorAll('input[name]').forEach(i=>o[i.name]=i.value.trim());if(ok(o)!==false)$('#mm').innerHTML='';save();render()}}
const empF=l=>F.filter(f=>l||f[0]!='nghi');
function addEmp(){form('Thêm nhân viên mới',empF(),{he:hs!='Tất cả'?hs:''},o=>{if(!o.ten){alert('Nhập họ tên');return false}if(o.msnv&&S.emps.some(e=>e.msnv==o.msnv)){alert('MSNV đã tồn tại');return false}S.emps.push({...o,id:++S.nid})})}
function editEmp(id){const e=S.emps.find(x=>x.id==id);form('Chỉnh sửa nhân viên',empF(!!e.nghi),e,o=>{Object.assign(e,o)})}
function leave(id){const e=S.emps.find(x=>x.id==id);form('Chuyển sang nghỉ việc: '+e.ten,[['nghi','Ngày nghỉ việc','date']],{nghi:e.dkn||TODAY},o=>{if(!o.nghi){alert('Chọn ngày nghỉ');return false}e.nghi=o.nghi})}
function back(id){const e=S.emps.find(x=>x.id==id);if(confirm('Đưa '+e.ten+' trở lại đang làm việc?')){e.nghi='';e.dkn='';save();render()}}
function del(id){const e=S.emps.find(x=>x.id==id);if(confirm('Xóa '+e.ten+'?')){S.emps=S.emps.filter(x=>x.id!=id);save();render()}}
/* ---------- Due check ---------- */
let asking=false;
function checkDue(){if(asking)return;const e=act().find(due);if(!e)return;asking=true;

<div class="f"><div class="w hide" id="nd"><label>Ngày nghỉ việc mới</label><input type="date" id="ndv" value="${e.dkn}"></div></div>
<div class="foot"><button class="b r" id="y">Có, chuyển nghỉ việc</button><button class="b s" id="n">Không, sửa ngày nghỉ</button></div></div></div>`;
$('#y').onclick=()=>{e.nghi=e.dkn;done()};
$('#n').onclick=()=>{if($('#nd').classList.contains('hide')){$('#nd').classList.remove('hide');$('#n').textContent='Lưu ngày mới';return}const v=$('#ndv').value;if(!v||v<=TODAY){alert('Chọn ngày sau hôm nay');return}e.dkn=v;done()};
function done(){asking=false;$('#mm').innerHTML='';save();render()}}

function renderEmp(){const hsList=['Tất cả',...new Set(S.emps.map(e=>e.he||'Khác'))];
$('#hs').innerHTML=hsList.map(h=>{const n=h=='Tất cả'?S.emps.filter(e=>$('#st').value=='left'?e.nghi:!e.nghi).length:S.emps.filter(e=>(e.he||'Khác')==h&&($('#st').value=='left'?e.nghi:!e.nghi)).length;return`<span class="pill ${h==hs?'on':''}" onclick="hs='${esc(h)}';page=0;renderEmp()">${esc(h)} (${n})</span>`}).join('');

/* ---------- Import/Export ---------- */
const MAP={'hệ thống':'he','vùng':'vung','kênh':'kenh','msnv':'msnv','họ và tên':'ten','chức danh chuyên môn':'cd','đơn vị':'dv','ngày tháng năm sinh':'ns','ngày sinh':'ns','ngày bắt đầu làm việc':'nbd','ngày nghỉ việc':'nghi','ngày dự kiến nghỉ việc':'dkn','phân loại':'pl','ghi chú':'gc'};
function cv(v,k){if(v==null||v===0||v==='0')return'';if(v instanceof Date)return iso(new Date(v.getTime()+43200000));v=String(v).trim();if(['ns','nbd','nghi','dkn'].includes(k)){const m=v.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return/^\d{4}-\d\d-\d\d/.test(v)?v.slice(0,10):''}return v}
$('#imp').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});
let list=[];wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n];const rs=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
let hi=rs.findIndex(r=>r.some(c=>String(c).toLowerCase().trim()=='msnv'));if(hi<0)return;const hd=rs[hi].map(c=>MAP[String(c??'').toLowerCase().trim()]);
rs.slice(hi+1).forEach(r=>{const o={};hd.forEach((k,i)=>{if(k)o[k]=cv(r[i],k)});if(o.msnv)list.push(o)})});
if(!list.length){alert('Không tìm thấy cột MSNV trong file');return}
const rep=confirm(`Đọc được ${list.length} nhân viên.\nOK = THAY THẾ toàn bộ danh sách\nHủy = CẬP NHẬT/THÊM theo MSNV (giữ dữ liệu cũ)`);
if(rep){S.emps=list.map(o=>({he:'',vung:'',kenh:'',ten:'',cd:'',dv:'',ns:'',nbd:'',nghi:'',dkn:'',pl:'',gc:'',...o,id:++S.nid}))}
else list.forEach(o=>{const e=S.emps.find(x=>x.msnv==o.msnv);e?Object.assign(e,o):S.emps.push({he:'',vung:'',kenh:'',ten:'',cd:'',dv:'',ns:'',nbd:'',nghi:'',dkn:'',pl:'',gc:'',...o,id:++S.nid})});
save();ev.target.value='';render();alert('Import xong')};
function exportX(){const H=F.map(f=>f[1]),wb=XLSX.utils.book_new();
const sh=l=>XLSX.utils.aoa_to_sheet([['STT',...H],...l.map((e,i)=>[i+1,...F.map(f=>f[2]&&e[f[0]]?new Date(e[f[0]]+'T12:00:00'):e[f[0]])])],{cellDates:true});
XLSX.utils.book_append_sheet(wb,sh(act()),'DS');XLSX.utils.book_append_sheet(wb,sh(gone()),'Nghỉ việc');
XLSX.writeFile(wb,'Danh_sach_nhan_su_'+TODAY+'.xlsx',{cellDates:true})}

function renderRep(){[...$('#rt').children].forEach((b,i)=>b.classList.toggle('on',i==rtab));[r1,r2,r3,r4,r5][rtab]()}
function r1(){const A=act(),c=cnt(A,e=>kn(e.kenh)),g=cnt(A.filter(e=>e.dkn),e=>kn(e.kenh)),t=cnt(S.rec,r=>kn(r.kenh),r=>r.sl);
const ks=[...new Set([...Object.keys(c),...Object.keys(g),...Object.keys(t)])].sort((a,b)=>a=='Khác'?1:b=='Khác'?-1:a.localeCompare(b));
const rows=ks.map(k=>[k,c[k]||0,g[k]||0,t[k]||0,(c[k]||0)-(g[k]||0)+(t[k]||0)]),m=rows.filter(r=>r[0]!='Khác');
const T=['Tổng (không gồm Khác)',sum(m,1),sum(m,2),sum(m,3),sum(m,4)];
dash([['Hiện tại',T[1]],['Nghỉ việc (dự kiến)',T[2],'r'],['Tuyển dụng',T[3],'g'],['Nhân sự sau biến động',T[4],'o']],['Kênh','Hiện tại','Nghỉ việc','Tuyển dụng','Sau biến động'],rows,T,{labels:m.map(r=>r[0]),sets:[['Hiện tại',m.map(r=>r[1])],['Nghỉ việc',m.map(r=>r[2])],['Tuyển dụng',m.map(r=>r[3])],['Sau biến động',m.map(r=>r[4]),3]],pie:[m.map(r=>r[0]),m.map(r=>r[4]),'Cơ cấu sau biến động']})}
function r2(){const A=act(),c=cnt(A,e=>nv(e.dv)),g=cnt(A.filter(e=>e.dkn),e=>nv(e.dv)),t=cnt(S.rec,r=>nv(r.dv),r=>r.sl);
const ks=[...new Set([...Object.keys(c),...Object.keys(g),...Object.keys(t)])].sort();
const rows=ks.map(k=>{const x=S.cut[k]||0;return[esc(k),c[k]||0,t[k]||0,g[k]||0,`<input type="number" min="0" value="${x}" style="width:70px;text-align:right" onchange="S.cut[this.dataset.k]=+this.value;save();r2()" data-k="${esc(k)}">`,(c[k]||0)+(t[k]||0)-(g[k]||0)-x]});
const T=['Tổng',sum(rows,1),sum(rows,2),sum(rows,3),ks.reduce((a,k)=>a+(S.cut[k]||0),0),sum(rows,5)];
const top=rows.slice().sort((a,b)=>b[1]-a[1]).slice(0,12);
dash([['Hiện tại',T[1]],['Dự kiến tăng',T[2],'g'],['Dự kiến giảm',T[3],'r'],['Dự kiến cắt',T[4],'r'],['Nhân sự còn lại',T[5],'o']],['Đơn vị','Hiện tại','Dự kiến tăng','Dự kiến giảm','Dự kiến cắt (nhập)','Nhân sự còn lại'],rows,T,{labels:top.map(r=>r[0].replace(/&amp;/g,'&')),sets:[['Hiện tại',top.map(r=>r[1])],['Tăng',top.map(r=>r[2])],['Giảm+cắt',top.map(r=>r[3]+(S.cut[r[0]]||0))],['Còn lại',top.map(r=>r[5]),3]],pie:[top.map(r=>r[0]),top.map(r=>r[5]),'Nhân sự còn lại (Top 12 đơn vị)']})}
function grp(keyf,title,hdr){const A=act(),c=cnt(A,keyf),g=cnt(A.filter(e=>e.dkn),keyf),t=cnt(S.rec,keyf,r=>r.sl);
const ks=[...new Set([...Object.keys(c),...Object.keys(g),...Object.keys(t)])].sort();
const rows=ks.map(k=>[esc(k),c[k]||0,t[k]||0,g[k]||0,(c[k]||0)+(t[k]||0)-(g[k]||0)]),T=['Tổng',sum(rows,1),sum(rows,2),sum(rows,3),sum(rows,4)];
const top=rows.slice().sort((a,b)=>b[1]-a[1]).slice(0,14);
dash([['Hiện tại',T[1]],['Tăng (tuyển)',T[2],'g'],['Giảm (nghỉ)',T[3],'r'],['Sau biến động',T[4],'o']],[hdr,'Hiện tại','Tăng','Giảm','Sau biến động'],rows,T,{labels:top.map(r=>r[0].replace(/&amp;/g,'&')),sets:[['Hiện tại',top.map(r=>r[1])],['Tăng',top.map(r=>r[2])],['Giảm',top.map(r=>r[3])]],pie:[top.map(r=>r[0]),top.map(r=>r[1]),'Nhân sự hiện tại']})}
function r3(){grp(e=>kn(e.pl)+' | '+kn(e.kenh),'','Phân loại | Kênh')}
let f4='he';
function r4(){const o=[['he','Hệ thống'],['vung','Vùng'],['kenh','Kênh'],['dv','Đơn vị'],['cd','Chức danh / Vị trí'],['pl','Phân loại']];
grp(e=>nv(e[f4]),'',o.find(x=>x[0]==f4)[1]);
$('#rp').insertAdjacentHTML('afterbegin',`<div class="card bar" style="margin-bottom:16px"><b>Biến động theo trường dữ liệu:</b><select onchange="f4=this.value;r4()">${o.map(x=>`<option value="${x[0]}" ${x[0]==f4?'selected':''}>${x[1]}</option>`).join('')}</select></div>`)}
let yr=new Date().getFullYear(),h5='';
function r5(){const ys=new Set([yr]);S.emps.forEach(e=>{if(e.nbd)ys.add(+e.nbd.slice(0,4));if(e.nghi)ys.add(+e.nghi.slice(0,4))});
const L=S.emps.filter(e=>!h5||(e.he||'Khác')==h5),rows=[];let ins=0,outs=0;
for(let m=1;m<=12;m++){const p=yr+'-'+String(m).padStart(2,'0'),end=p+'-31';
const hh=L.filter(e=>e.nbd&&e.nbd<=end&&(!e.nghi||e.nghi>end)).length,i=L.filter(e=>e.nbd&&e.nbd.slice(0,7)==p).length,o=L.filter(e=>e.nghi&&e.nghi.slice(0,7)==p).length;
ins+=i;outs+=o;rows.push(['Tháng '+m,hh,i,o,i-o])}
const sel=`<div class="card bar" style="margin-bottom:16px"><b>Năm:</b><select onchange="yr=+this.value;r5()">${[...ys].sort().map(y=>`<option ${y==yr?'selected':''}>${y}</option>`).join('')}</select><b>Hệ thống:</b><select onchange="h5=this.value;r5()"><option value="">Tất cả</option>${[...new Set(S.emps.map(e=>e.he||'Khác'))].map(h=>`<option ${h==h5?'selected':''}>${esc(h)}</option>`).join('')}</select><small>Hiện hữu = nhân sự có ngày nhận việc ≤ cuối tháng và chưa nghỉ tại thời điểm đó</small></div>`;
dash([['Hiện hữu cuối năm',rows[11][1]],['Tuyển thêm trong năm',ins,'g'],['Nghỉ việc trong năm',outs,'r'],['Tăng ròng',ins-outs,'o']],['Tháng','Hiện hữu cuối tháng','Tuyển thêm','Nghỉ việc','Tăng/giảm ròng'],rows,['Cả năm',rows[11][1],ins,outs,ins-outs],{labels:rows.map(r=>'T'+r[0].slice(6)),sets:[['Tuyển thêm',rows.map(r=>r[2]),2],['Nghỉ việc',rows.map(r=>r[3]),1],['Hiện hữu',rows.map(r=>r[1]),0,'line']],pie:[['Tuyển thêm','Nghỉ việc'],[ins,outs],'Tuyển thêm vs Nghỉ việc']},sel)}
go(0);
</script></body></html>
