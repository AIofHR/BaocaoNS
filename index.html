<style>
:root{--bg:#f1f5f9;--c:#fff;--t:#0f172a;--m:#64748b;--p:#1d4ed8;--b:#e2e8f0;--r:#dc2626;--g:#16a34a;--o:#ea580c}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Segoe UI,system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:linear-gradient(120deg,#0f172a,#1e3a8a);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0}nav{display:flex;gap:6px}
nav button{background:transparent;border:0;color:#cbd5e1;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:#1e3a8a;font-weight:600}
main{padding:18px 24px;max-width:1700px;margin:auto}.card{background:var(--c);border-radius:12px;box-shadow:0 1px 3px #0001;padding:16px;margin-bottom:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.sp{flex:1}
button.b,label.b{background:var(--p);color:#fff;border:0;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-block}
.b.s{background:#e2e8f0;color:var(--t)}.b.r{background:var(--r)}.b.g{background:var(--g)}
input,select{padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{padding:5px 12px;border-radius:20px;background:#e2e8f0;cursor:pointer;font-size:13px}.pill.on{background:var(--p);color:#fff}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--b);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}th{background:#f8fafc;position:sticky;top:0;text-align:left;padding:8px;border-bottom:2px solid var(--b);white-space:nowrap;z-index:1}
td{padding:6px 8px;border-bottom:1px solid var(--b)}tr:hover td{background:#f8fafc}tr.due td{background:#fee2e2;color:#991b1b;font-weight:600}
td.n,th.n{text-align:right}tfoot td{font-weight:700;background:#f1f5f9}
.ic{border:0;background:#e2e8f0;border-radius:6px;padding:3px 7px;cursor:pointer;margin-right:2px}.ic:hover{background:#cbd5e1}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--c);border-radius:12px;padding:14px 16px;border-left:5px solid var(--p);box-shadow:0 1px 3px #0001}.k small{color:var(--m)}.k b{display:block;font-size:26px}
.k.g{border-color:var(--g)}.k.r{border-color:var(--r)}.k.o{border-color:var(--o)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.ch{position:relative;height:340px}
.mask{position:fixed;inset:0;background:#0f172a99;display:flex;align-items:center;justify-content:center;z-index:50}
.mod{background:#fff;border-radius:14px;padding:20px;width:min(620px,94vw);max-height:90vh;overflow:auto}.mod h3{margin:0 0 12px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;color:var(--m);display:block}.f input{width:100%}.f .w{grid-column:1/-1}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.hide{display:none}
.rt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.rt button{padding:9px 16px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;cursor:pointer}.rt button.on{background:var(--p);color:#fff;border-color:var(--p)}
.ms{position:relative;display:inline-block}.ms summary{padding:7px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer;list-style:none;min-width:170px}.ms summary::-webkit-details-marker{display:none}.ms summary::after{content:' ▾';float:right}.mpn{position:absolute;z-index:30;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 8px 24px #0003;padding:8px;width:320px}.mpn input.msq{width:100%}.mo{max-height:260px;overflow:auto;margin-top:6px}.mo label{display:block;padding:3px 4px;cursor:pointer;font-size:13px}.mo label:hover{background:#f1f5f9}.mact{font-size:12px;margin-top:6px}
.pg{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--m)}
